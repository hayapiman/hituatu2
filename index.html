<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>筆圧・時間計測実験</title>
<link rel="stylesheet" href="style.css?v=20261121-confidence15">
</head>
<body>
<h1>筆圧・時間計測実験</h1>
<section id="setup">
  <h2>実験設定</h2>
  <label for="participantId">被験者ID</label>
  <input id="participantId" autocomplete="off" placeholder="例：P01">
  <label for="questionOrderMode">出題順</label>
  <select id="questionOrderMode">
    <option value="sequential">順番通り</option>
    <option value="random">ランダム</option>
  </select>
  <p>入力方法：ペンのみ（指・マウスは無効）</p>
  <button id="startExperiment">実験を開始</button>
</section>
<section id="calibration" hidden>
  <h2 id="calibrationTitle">通常筆圧キャリブレーション</h2>
  <p id="calibrationInstruction">普段通りの力で、名前を書いてください。</p>
  <p>キャリブレーション筆圧：<span id="calibrationPressure">0</span></p>
  <canvas id="calibrationCanvas" width="900" height="300"></canvas>
  <button id="calibrationClear">書き直す</button>
  <button id="calibrationNext">次へ</button>
</section>
<section id="experimentArea" hidden>
  <div id="writingArea">
  <div id="question">
    <h2>問題 <span id="questionProgress"></span></h2>
    <p id="questionText"></p>
  </div>
  <div id="info">
    <p>筆圧：<span id="pressure">0</span></p>
    <p>正規化筆圧：<span id="normalizedPressure">0</span> %</p>
    <p>筆圧変動：<span id="pressureChange">0</span></p>
    <p>速度：<span id="speed">0</span> px/s</p>
    <p>加速度：<span id="acceleration">0</span> px/s²</p>
    <p>停止時間：<span id="stopTime">0</span> 秒</p>
  </div>
  <p>一部だけわかる場合は、わかる範囲で書いて「回答確定」を押してください。何も書けない場合のみ「分からない」を押してください。</p>
  <canvas id="canvas" width="900" height="400"></canvas>
  <div><button id="clear">書き直す</button><button id="submit">回答確定</button><button id="unknown">分からない</button></div>
  <div>
    <button id="download">詳細CSV保存</button>
    <button id="downloadEvents">イベントCSV保存</button>
    <button id="downloadStops">停止区間CSV保存</button>
    <button id="downloadSummary">集計CSV保存</button>
  </div>
  </div>
  <section id="confidenceArea" hidden>
    <h2>自信度アンケート（<span id="confidenceProgress"></span>）</h2>
    <p>今書いた漢字について、どの程度自信がありますか？</p>
    <div class="confidenceChoices">
      <label><input type="radio" name="confidence" value="5"> 5：非常に自信がある</label>
      <label><input type="radio" name="confidence" value="4"> 4：やや自信がある</label>
      <label><input type="radio" name="confidence" value="3"> 3：どちらともいえない</label>
      <label><input type="radio" name="confidence" value="2"> 2：あまり自信がない</label>
      <label><input type="radio" name="confidence" value="1"> 1：まったく自信がない</label>
    </div>
    <button id="confidenceNext">次の問題へ（必須回答）</button>
  </section>
</section>
<script src="script-v2.js?v=20261121-confidence15"></script>
</body>
</html>
